name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and MongoDB integration
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Report backend dependency advisories
        run: |
          npm audit --prefix backend --json > backend-audit.json || true
          node scripts/summarize-npm-audit.cjs backend-audit.json
      - name: Fail on backend dependency advisories
        run: npm audit --prefix backend --audit-level=low
      - name: Check backend JavaScript syntax
        run: find backend -type f -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Initialize MongoDB replica set
        run: |
          for attempt in {1..30}; do
            if mongosh --host 127.0.0.1:27017 --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})' 2>/dev/null; then break; fi
            sleep 2
          done
          for attempt in {1..30}; do
            if mongosh --host 127.0.0.1:27017 --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary" >&2
          exit 1
      - name: Run backend tests
        env:
          MONGO_INTEGRATION_URI: mongodb://127.0.0.1:27017/freshmart_test?replicaSet=rs0
        run: npm test --prefix backend

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Report frontend dependency advisories
        run: |
          npm audit --prefix frontend --json > frontend-audit.json || true
          node scripts/summarize-npm-audit.cjs frontend-audit.json
      - name: Fail on frontend dependency advisories
        run: npm audit --prefix frontend --audit-level=low
      - name: Lint frontend
        run: npm run lint --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
